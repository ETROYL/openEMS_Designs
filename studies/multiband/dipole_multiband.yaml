variables:
  arm_length:
    type: "float"
    start: 0.15
    stop: 0.30
    step: 0.01
    default: 0.20
  root_width:
    type: "float"
    start: 0.004
    stop: 0.020
    step: 0.002
    default: 0.010
  tip_width:
    type: "float"
    start: 0.010
    stop: 0.40
    step: 0.005
    default: 0.30
  feed_gap:
    type: "float"
    start: 0.002
    stop: 0.002
    default: 0.002
    optimize: true

simulation:
  unit: 1.0
  fstart: 0.3
  fstop: 1.0
  n_pts: 301
  end_criteria: 1e-2
  max_timesteps: 200000
  target_s11_db: -15.0

materials:
  - name: "PEC_Patch"
    type: "metal"

primitives:
  - type: "polygon"
    material: "PEC_Patch"
    priority: 10
    elevation: 0
    length: 0.001
    norm_dir: "z"
    points:
      x: ["feed_gap / 2.0", "arm_length", "arm_length", "feed_gap / 2.0"]
      y: ["root_width / 2.0", "tip_width / 2.0", "-tip_width / 2.0", "-root_width / 2.0"]

  - type: "polygon"
    material: "PEC_Patch"
    priority: 10
    elevation: 0
    length: 0.001
    norm_dir: "z"
    points:
      x: ["-feed_gap / 2.0", "-arm_length", "-arm_length", "-feed_gap / 2.0"]
      y: ["root_width / 2.0", "tip_width / 2.0", "-tip_width / 2.0", "-root_width / 2.0"]

ports:
  - id: 1
    type: "lumped"
    resistance: 75.0
    direction: "x"
    excite: 1
    start: ["-feed_gap / 2.0", "-root_width / 2.0", 0]
    stop: ["feed_gap / 2.0", "root_width / 2.0", 0.001]
