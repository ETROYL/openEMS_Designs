variables:
  arm_length:
    type: "float"
    start: 0.20
    stop: 0.35
    step: 0.02
    default: 0.18    # Default value for view_cad.py visualization
  arm_width:
    type: "float"
    start: 0.10
    stop: 0.35
    step: 0.02
    default: 0.18    # Default value for view_cad.py visualization
  flare_width:
    type: "float"
    start: 0.01
    stop: 0.20
    step: 0.01
    default: 0.10   # Default value for view_cad.py visualization
  flare_length:
    type: "float"
    start: 0.005
    stop: 0.08
    step: 0.005
    default: 0.02   # Default value for view_cad.py visualization
  feed_gap:
    type: "float"
    start: 0.002
    stop: 0.010
    step: 0.002
    default: 0.002   # Default value for view_cad.py visualization
  feed_width:
    type: "float"
    start: 0.006
    stop: 0.03
    step: 0.002
    default: 0.015   # Default value for view_cad.py visualization
#  port_z0:
#    type: "float"
#    start: 50.0
#    stop: 300.0
#    step: 50.0
#    default: 50   # Default value for view_cad.py visualization

simulation:
  unit: 1.0
  fstart: 0.2
  fstop: 1.2
  n_pts: 301
  end_criteria: 1e-2  # -20 dB energy threshold for fast optimization trials
  max_timesteps: 50000  # Caps long runs during optimization
  target_s11_db: -20.0 # Target UWB match threshold across full spectrum

materials:
  - name: "PEC_Patch"
    type: "metal"

primitives:
  # Right Wing
  - type: "polygon"
    material: "PEC_Patch"
    priority: 10
    elevation: 0          
    length: 0.001             
    norm_dir: "z"
    points:
      x: ["feed_gap / 2.0", "feed_gap / 2.0 + flare_length", "arm_length", "arm_length", "feed_gap / 2.0 + flare_length", "feed_gap / 2.0"]
      y: ["feed_width / 2.0", "flare_width / 2.0", "arm_width / 2.0", "-arm_width / 2.0", "-flare_width / 2.0", "-feed_width / 2.0"]

  # Left Wing
  - type: "polygon"
    material: "PEC_Patch"
    priority: 10
    elevation: 0          
    length: 0.001             
    norm_dir: "z"
    points:
      x: ["-feed_gap / 2.0", "-feed_gap / 2.0 - flare_length", "-arm_length", "-arm_length", "-feed_gap / 2.0 - flare_length", "-feed_gap / 2.0"]
      y: ["feed_width / 2.0", "flare_width / 2.0", "arm_width / 2.0", "-arm_width / 2.0", "-flare_width / 2.0", "-feed_width / 2.0"]

ports:
  - id: 1
    type: "lumped"
    resistance: 200.0
    direction: "x"
    excite: 1
    start: ["-feed_gap / 2.0", "-0.001", 0]
    stop:  ["feed_gap / 2.0",   "0.001", 0.001] 
