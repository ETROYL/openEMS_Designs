variables:
  arm_length:
    type: "float"
    start: 0.08
    stop: 0.28
    step: 0.02
    default: 0.18    # Default value for view_cad.py visualization
  flare_width:
    type: "float"
    start: 0.01
    stop: 0.02
    step: 0.002
    default: 0.015   # Default value for view_cad.py visualization
  feed_gap:
    type: "float"
    start: 0.001
    stop: 0.005
    step: 0.0005
    default: 0.002   # Default value for view_cad.py visualization
#  port_z0:
#    type: "float"
#    start: 50.0
#    stop: 300.0
#    step: 50.0
#    default: 50   # Default value for view_cad.py visualization

simulation:
  unit: 1.0
  fstart: 0.2
  fstop: 1.2
  n_pts: 301
  end_criteria: 1e-2  # -20 dB energy threshold for fast optimization trials

materials:
  - name: "PEC_Patch"
    type: "metal"

primitives:
  # Right Wing
  - type: "polygon"
    material: "PEC_Patch"
    priority: 10
    elevation: 0          
    length: 0.0005             
    norm_dir: "z"
    points:
      x: ["feed_gap / 2.0", "feed_gap / 2.0 + 0.01", "arm_length", "arm_length", "feed_gap / 2.0 + 0.01", "feed_gap / 2.0"]
      y: [0.0005, "flare_width * 0.8", "flare_width", "-flare_width", "-flare_width * 0.8", -0.0005]

  # Left Wing
  - type: "polygon"
    material: "PEC_Patch"
    priority: 10
    elevation: 0          
    length: 0.0005             
    norm_dir: "z"
    points:
      x: ["-feed_gap / 2.0", "-(feed_gap / 2.0 + 0.01)", "-arm_length", "-arm_length", "-(feed_gap / 2.0 + 0.01)", "-feed_gap / 2.0"]
      y: [0.0005, "flare_width * 0.8", "flare_width", "-flare_width", "-flare_width * 0.8", -0.0005]

ports:
  - id: 1
    type: "lumped"
    resistance: 50.0
    direction: "x"
    excite: 1
    start: ["-feed_gap / 2.0", -0.0005, 0]
    stop:  ["feed_gap / 2.0",   0.0005, 0.0005] 
